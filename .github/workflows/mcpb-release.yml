name: Attach MCP Bundle to release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Check the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate bundle
        run: npm run build:mcpb

      - name: Smoke-test the bundle
        run: node --import tsx tests/acceptance/run.ts --mode bundle --target fixture --scenario discovery-tools

      # Run from the bundle's directory so the file names the bare asset name and `sha256sum -c` works after download.
      - name: Write checksum
        working-directory: test-results/mcpb
        run: sha256sum mainwp-mcp.mcpb > mainwp-mcp.mcpb.sha256

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: test-results/mcpb/mainwp-mcp.mcpb

      - name: Attach bundle and checksum to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" test-results/mcpb/mainwp-mcp.mcpb test-results/mcpb/mainwp-mcp.mcpb.sha256
